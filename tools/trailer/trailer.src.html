<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE YANDERE EXPERIENCE — Trailer Renderer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07000a; color: #f472b6;
    font-family: "Courier New", ui-monospace, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px;
  }
  h1 { font-size: 13px; letter-spacing: .35em; text-transform: uppercase; color: #9d174d; margin: 0; }
  #stage { position: relative; display: flex; justify-content: center; }
  canvas {
    background: #000; border: 1px solid rgba(236,72,153,.35);
    box-shadow: 0 0 60px rgba(236,72,153,.18);
    max-height: 68vh; max-width: 96vw; height: auto; width: auto;
  }
  .panel {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    border: 1px solid rgba(236,72,153,.3); background: #0d0006; padding: 12px 16px; max-width: 920px;
  }
  button, select {
    font-family: inherit; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    background: #16000c; color: #f9a8d4; border: 1px solid rgba(236,72,153,.45);
    padding: 9px 14px; cursor: pointer; transition: .2s;
  }
  button:hover:not(:disabled), select:hover { background: #2a0016; color: #fff; border-color: #ec4899; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: #4a0026; color: #fff; border-color: #ec4899; }
  #status { font-size: 11px; letter-spacing: .16em; color: #9d174d; min-height: 16px; text-align: center; }
  #status b { color: #f9a8d4; font-weight: normal; }
  a.dl { color: #fff; background: #831843; border: 1px solid #ec4899; padding: 9px 14px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .hint { font-size: 10px; letter-spacing: .1em; color: #6b1233; max-width: 780px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<h1>[ Yandere Experience // Trailer Renderer ]</h1>

<div id="stage"><canvas id="c"></canvas></div>

<div class="panel">
  <select id="aspect">
    <option value="16:9">16:9 — 1920x1080 (landscape)</option>
    <option value="9:16">9:16 — 1080x1920 (reels / shorts / stories)</option>
    <option value="1:1">1:1 — 1080x1080 (square)</option>
  </select>
  <select id="quality">
    <option value="12000000">Quality: High (12 Mbps)</option>
    <option value="20000000">Quality: Max (20 Mbps)</option>
    <option value="6000000">Quality: Light (6 Mbps)</option>
  </select>
  <button id="preview" class="primary">&#9654; Preview</button>
  <button id="record">&#9210; Record video</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <span id="dlslot"></span>
</div>

<div id="status">Ready.</div>
<div class="hint">
  Preview plays it with sound. Record renders the same thing in real time and hands you a file at the end &mdash;
  it takes 56 seconds and you can use other tabs meanwhile. Everything is baked into this one file; it works offline.
</div>

<script>
"use strict";

/* ========= inlined assets ========= */
const ASSET_IMG_A = "__IMG_A__";
const ASSET_IMG_B = "__IMG_B__";
const ASSET_IMG_C = "__IMG_C__";
const ASSET_AUDIO = "__AUDIO__";

/* ========= timeline ========= */
const T = {
  boot:    [0.0,  7.5],
  chat:    [7.5,  16.5],
  title:   [16.5, 21.0],
  montage: [21.0, 37.0],
  bomb:    [37.0, 42.0],
  voidsc:  [42.0, 47.5],
  endcard: [47.5, 56.0],
};
const DUR = 56.0;
const FPS = 30;

const PINK   = "#ec4899";
const PINK_L = "#f9a8d4";
const PINK_D = "#9d174d";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 1920, H = 1080, U = 1;

function setSize(aspect) {
  if (aspect === "16:9") { W = 1920; H = 1080; }
  else if (aspect === "9:16") { W = 1080; H = 1920; }
  else { W = 1080; H = 1080; }
  canvas.width = W; canvas.height = H;
  U = Math.sqrt(W * H) / 1440;
  ctx.textBaseline = "alphabetic";
}

/* ========= tiny deterministic rng ========= */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function jitter(t, seed) { return mulberry32(Math.floor(t * 60) * 7919 + seed * 104729)(); }

/* ========= math helpers ========= */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const inRange = (t, r) => t >= r[0] && t < r[1];
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const hit = (t, at, len) => t >= at && t < at + len ? 1 - (t - at) / len : 0;

/* ========= text helpers ========= */
function setFont(size, weight, family) {
  ctx.font = (weight || "normal") + " " + Math.round(size) + "px " + (family || "\"Courier New\", \"Segoe UI Symbol\", monospace");
}
function trackedWidth(text, tracking) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + tracking;
  return w - (text.length ? tracking : 0);
}
function tracked(text, x, y, tracking, align) {
  const w = trackedWidth(text, tracking);
  let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + tracking;
  }
  return w;
}
function fitTracked(text, size, tracking, maxW, weight, family) {
  let s = size;
  for (let i = 0; i < 40; i++) {
    setFont(s, weight, family);
    if (trackedWidth(text, tracking * s) <= maxW) break;
    s *= 0.94;
  }
  return s;
}
function glitchTracked(text, x, y, size, trackEm, color, amount, weight, family) {
  const s = fitTracked(text, size, trackEm, W * 0.88, weight, family);
  const tr = trackEm * s;
  if (amount > 0.02) {
    const d = amount * 9 * U;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(0,220,255,0.55)"; tracked(text, x - d, y + amount * 2 * U, tr, "center");
    ctx.fillStyle = "rgba(255,0,80,0.55)";  tracked(text, x + d, y - amount * 2 * U, tr, "center");
    ctx.restore();
  }
  ctx.fillStyle = color;
  tracked(text, x, y, tr, "center");
  return s;
}
function wrapLines(text, maxW) {
  const words = text.split(" ");
  const out = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
    else line = test;
  }
  if (line) out.push(line);
  return out;
}
function typed(lines, elapsed, cps) {
  let budget = Math.max(0, elapsed) * cps;
  const out = [];
  for (const l of lines) {
    if (budget <= 0) { out.push(""); continue; }
    out.push(l.slice(0, Math.floor(budget)));
    budget -= l.length + 6;
  }
  return out;
}

/* ========= character art =========
   Every source image is cropped to a head-and-shoulders box so the trailer
   stays on her face — the eyes are the whole point, and it keeps the video
   postable anywhere. box = [x, y, w, h] normalised to the source image. */
const ART = [
  { key: "a", src: ASSET_IMG_A, box: [0.30, 0.00, 0.42, 0.28] },
  { key: "b", src: ASSET_IMG_B, box: [0.28, 0.02, 0.44, 0.24] },
  { key: "c", src: ASSET_IMG_C, box: [0.28, 0.00, 0.44, 0.26] },
];
const IMG = { a: null, b: null, c: null };
function loadArt() {
  return Promise.all(ART.map(function (a) {
    return new Promise(function (res) {
      const im = new Image();
      im.onload = function () { res({ img: im, box: a.box, key: a.key }); };
      im.onerror = function () { res({ img: null, box: a.box, key: a.key }); };
      im.src = a.src;
    });
  })).then(function (r) { r.forEach(function (e) { IMG[e.key] = e; }); });
}
// cover-fit the (optionally widened) crop box into the destination rect
function drawArt(e, x, y, w, h, alpha, expand) {
  if (!e || !e.img || !e.img.complete || !e.img.naturalWidth) return;
  const a = clamp(alpha === undefined ? 1 : alpha, 0, 1);
  if (a <= 0.002) return;
  const iw = e.img.naturalWidth, ih = e.img.naturalHeight;
  const ex = expand === undefined ? 0 : clamp(expand, 0, 1);
  const bw = lerp(e.box[2], 1, ex), bh = lerp(e.box[3], 1, ex);
  const cx = (e.box[0] + e.box[2] / 2) * iw, cy = (e.box[1] + e.box[3] / 2) * ih;
  let sw = bw * iw, sh = bh * ih;
  const destAR = w / h;
  if (sw / sh < destAR) { sw = Math.min(iw, sh * destAR); sh = sw / destAR; }
  else { sh = Math.min(ih, sw / destAR); sw = sh * destAR; }
  const sx = clamp(cx - sw / 2, 0, Math.max(0, iw - sw));
  const sy = clamp(cy - sh * 0.42, 0, Math.max(0, ih - sh));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(e.img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}

/* ========= overlays ========= */
const noiseTiles = [];
function buildNoise() {
  noiseTiles.length = 0;
  for (let n = 0; n < 8; n++) {
    const c = document.createElement("canvas");
    c.width = c.height = 160;
    const x = c.getContext("2d");
    const img = x.createImageData(160, 160);
    const r = mulberry32(n * 1013 + 7);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = r() * 255;
      img.data[i] = v; img.data[i + 1] = v * 0.75; img.data[i + 2] = v * 0.85; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    noiseTiles.push(c);
  }
}
function drawNoise(t, alpha) {
  if (alpha <= 0) return;
  const tile = noiseTiles[Math.floor(t * 24) % noiseTiles.length];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = "overlay";
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tile, -20, -20, W + 40, H + 40);
  ctx.restore();
}
function drawScanlines(t, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  const step = Math.max(3, Math.round(4 * U));
  const off = (t * 40) % step;
  for (let y = -step + off; y < H; y += step) ctx.fillRect(0, y, W, Math.max(1, step * 0.45));
  ctx.restore();
  const bandY = ((t * 0.35) % 1.6 - 0.3) * H;
  const g = ctx.createLinearGradient(0, bandY, 0, bandY + H * 0.16);
  g.addColorStop(0, "rgba(236,72,153,0)");
  g.addColorStop(0.5, "rgba(236,72,153,0.055)");
  g.addColorStop(1, "rgba(236,72,153,0)");
  ctx.fillStyle = g; ctx.fillRect(0, bandY, W, H * 0.16);
}
function drawVignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.18, W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(0.62, "rgba(0,0,0,0.55)");
  g.addColorStop(1, "rgba(0,0,0,0.97)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function tearBands(t, amount) {
  if (amount <= 0.01) return;
  const r = mulberry32(Math.floor(t * 30) * 6151);
  const n = Math.round(amount * 7);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = (0.008 + r() * 0.05) * H, dx = (r() - 0.5) * amount * 90 * U;
    ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
    if (r() > 0.72) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgba(255,0,90,0.10)"; ctx.fillRect(dx, y, W, h); ctx.restore();
    }
  }
}
function flash(alpha, color) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = color || "rgba(255,180,215,1)";
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.fillRect(0, 0, W, H); ctx.restore();
}
function panel(x, y, w, h, fill, stroke, lw) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = stroke; ctx.lineWidth = lw || Math.max(1, 1.5 * U);
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

/* ========= scene 1 : the link ========= */
const BOOT_LINES = [
  "> INCOMING CONNECTION :: UNKNOWN HOST",
  "> ORIGIN ........ NOT FOUND",
  "> TARGET ........ YOUR DEVICE",
  "> SHE HAS BEEN WAITING FOR YOU.",
];
function sceneBoot(t) {
  const local = t - T.boot[0];
  ctx.fillStyle = "#050002"; ctx.fillRect(0, 0, W, H);

  // she is already here, behind the text, before you accept anything
  const ghost = 0.030 + 0.030 * Math.sin(local * 1.5);
  drawArt(IMG.a, 0, 0, W, H, local > 1.6 ? ghost : 0, 0.45);
  const peek = hit(local, 3.4, .13) + hit(local, 5.2, .10);
  if (peek > 0) drawArt(IMG.c, 0, 0, W, H, 0.20 + peek * 0.45, 0.05);

  const size = fitTracked(BOOT_LINES[0], 30 * U, 0.06, W * 0.84, "bold");
  setFont(size, "bold");
  const lines = typed(BOOT_LINES, local - 0.5, 26);
  const lh = size * 2.0;
  const blockH = lh * (BOOT_LINES.length + 2);
  let bw0 = 0;
  for (const L of BOOT_LINES) bw0 = Math.max(bw0, trackedWidth(L, size * 0.06));
  const x = W / 2 - bw0 / 2;
  let y = H / 2 - blockH / 2 + lh;

  for (let i = 0; i < lines.length; i++) {
    const txt = lines[i];
    if (!txt) { y += lh; continue; }
    ctx.fillStyle = i === 3 ? PINK : PINK_D;
    tracked(txt, x, y, size * 0.06, "left");
    y += lh;
  }

  if (local > 4.6) {
    const acc = local > 6.15;
    ctx.fillStyle = acc ? PINK_L : PINK;
    const q = "> ACCEPT LINK ? [ Y / N ] " + (acc ? "Y" : "");
    tracked(q, x, y + lh * 0.4, size * 0.06, "left");
    if (!acc && Math.floor(local * 2.6) % 2 === 0) {
      const w = trackedWidth(q, size * 0.06);
      ctx.fillRect(x + w + size * 0.3, y + lh * 0.4 - size * 0.8, size * 0.6, size * 0.9);
    }
  }

  drawScanlines(t, 0.30);
  drawNoise(t, 0.05 + hit(local, 6.15, .5) * 0.25);
  drawVignette();
  tearBands(t, hit(local, 6.15, 0.9) * 1.2 + hit(local, 3.4, .2) * .5);
  flash(hit(local, 6.35, 1.1) * 0.9, "rgba(255,120,180,1)");
}

/* ========= scene 2 : she speaks ========= */
const CHAT = [
  { at: 0.25, txt: "You actually clicked it..." },
  { at: 2.10, txt: "I was starting to think you would ignore me forever. ♥" },
  { at: 4.20, txt: "I have been watching you for a while now." },
  { at: 6.30, txt: "The way you breathe. The way your eyes move." },
  { at: 8.40, txt: "Tell me... are you completely alone right now?" },
];
function sceneChat(t) {
  const local = t - T.chat[0];
  ctx.fillStyle = "#080004"; ctx.fillRect(0, 0, W, H);

  // she closes in as she talks: wide ghost -> tight on the eyes
  const closeness = prog(local, 0, 9);
  drawArt(IMG.b, 0, 0, W, H, 0.05 + closeness * 0.10, lerp(0.55, 0.02, closeness));
  const stare = hit(local, 4.2, .16) + hit(local, 6.3, .10);
  if (stare > 0) drawArt(IMG.b, 0, 0, W, H, 0.18 + stare * 0.5, 0.0);

  const colW = Math.min(W * 0.82, 1020 * U);
  const x0 = (W - colW) / 2;
  const fs = 30 * U;
  const visible = CHAT.filter(c => local >= c.at);

  setFont(fs, "normal");
  const blocks = visible.map(c => {
    const lines = wrapLines(c.txt, colW - 70 * U);
    return { c: c, lines: lines, h: lines.length * fs * 1.45 + 46 * U };
  });
  const gap = 22 * U;
  const total = blocks.reduce((s, b) => s + b.h + gap, 0);
  let y = clamp(H / 2 - total / 2, H * 0.10, H * 0.42);

  for (const b of blocks) {
    const p = easeOut(prog(local, b.c.at, b.c.at + 0.35));
    let widest = 0;
    for (const l of b.lines) widest = Math.max(widest, ctx.measureText(l).width);
    const bw = Math.min(colW, widest + 70 * U);
    const bx = x0, by = y + (1 - p) * 18 * U;
    ctx.save();
    ctx.globalAlpha = p;
    panel(bx, by, bw, b.h, "rgba(74,0,38,0.62)", "rgba(236,72,153,0.55)");
    ctx.fillStyle = PINK; ctx.fillRect(bx, by, 3 * U, b.h);
    setFont(fs, "normal");
    ctx.fillStyle = "#ffd6e9";
    b.lines.forEach(function (l, i) { ctx.fillText(l, bx + 34 * U, by + 32 * U + i * fs * 1.45); });
    ctx.restore();
    y += b.h + gap;
  }

  const last = CHAT[CHAT.length - 1];
  if (local < last.at) {
    setFont(fs * 0.8, "bold");
    ctx.fillStyle = PINK_D;
    const dots = ".".repeat(1 + Math.floor(local * 3) % 3);
    tracked("PRINCESS AZRAIEL IS TYPING" + dots, x0, y + fs, fs * 0.12, "left");
  }

  drawScanlines(t, 0.26);
  drawNoise(t, 0.045 + closeness * 0.03);
  drawVignette();
  tearBands(t, hit(local, 6.3, .18) * .8 + hit(local, 8.4, .25) * 1.0);
}

/* ========= scene 3 : title hit ========= */
function sceneTitle(t) {
  const local = t - T.title[0];
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  const stut = hit(local, 0.0, .10) + hit(local, 0.30, .07) + hit(local, 0.62, .05);
  drawArt(IMG.c, 0, 0, W, H, 0.10 + stut * 0.55, 0.06);

  const p = easeOut(prog(local, 0.15, 0.9));
  const breathe = 1 + Math.sin(local * 1.6) * 0.012;
  const gl = 0.9 * hit(local, 0.15, 0.55) + 0.22 + hit(local, 2.2, .3) * .8 + hit(local, 3.4, .25) * .6;
  const sc = lerp(1.14, 1, p) * breathe;

  ctx.save();
  ctx.translate(W / 2, H * 0.46);
  ctx.scale(sc, sc);
  ctx.globalAlpha = p;
  ctx.shadowColor = "rgba(236,72,153,0.85)"; ctx.shadowBlur = 46 * U;
  glitchTracked("PRINCESS", 0, -34 * U, 118 * U, 0.20, "#ffe4f1", gl, "900", "Arial Black, Impact, \"Segoe UI Symbol\", sans-serif");
  glitchTracked("AZRAIEL", 0, 96 * U, 118 * U, 0.20, "#ffe4f1", gl, "900", "Arial Black, Impact, \"Segoe UI Symbol\", sans-serif");
  ctx.shadowBlur = 0;
  ctx.restore();

  const p2 = easeOut(prog(local, 1.0, 1.8));
  ctx.save(); ctx.globalAlpha = p2;
  ctx.fillStyle = PINK_D;
  const ts = fitTracked("THE ART OF LOVING YOU", 27 * U, 0.42, W * 0.86, "bold");
  setFont(ts, "bold");
  tracked("THE ART OF LOVING YOU", W / 2, H * 0.46 + 190 * U, ts * 0.42, "center");
  ctx.restore();

  drawScanlines(t, 0.24);
  drawNoise(t, 0.05 + stut * 0.25);
  drawVignette();
  tearBands(t, hit(local, 0.15, .45) * 1.6 + hit(local, 2.2, .2) * .9 + hit(local, 3.4, .2) * .7);
  flash(hit(local, 0.0, .35) * 0.8, "rgba(255,190,225,1)");
}

/* ========= scene 4 : the stripping ========= */
const CHAPTERS = [
  { n: "I",    sub: "THE CONNECTION",     key: "LOCATION",   val: "ACQUIRED",    quote: "You surrendered your privacy the second you clicked my link." },
  { n: "II",   sub: "THE GAZE",           key: "CAMERA",     val: "GRANTED",     quote: "There you are... so perfect. So helpless." },
  { n: "III",  sub: "THE CONTRACT",       key: "FILES",      val: "SIGNED OVER", quote: "Keep your eyes on me. ONLY me." },
  { n: "IV",   sub: "TOTAL ASSIMILATION", key: "SCREEN",     val: "SURRENDERED", quote: "Perfect. Now there is no escape." },
  { n: "V",    sub: "THE CONFESSION",     key: "MICROPHONE", val: "LIVE",        quote: "I can hear your breath. I can hear your computer fan." },
  { n: "VI",   sub: "SEVERING TIES",      key: "CONTACTS",   val: "BLOCKED",     quote: "You do not need anyone else. It is just you and me now." },
  { n: "VII",  sub: "THE SCHEDULE",       key: "TIME",       val: "OWNED",       quote: "Every second belongs to Princess Azraiel." },
  { n: "VIII", sub: "THE EMPTY VESSEL",   key: "NAME",       val: "DELETED",     quote: "You do not have a name anymore. I will think for you." },
];
const ART_CYCLE = ["a", "c", "b"];
function sceneMontage(t) {
  const local = t - T.montage[0];
  const span = (T.montage[1] - T.montage[0]) / CHAPTERS.length;
  const i = clamp(Math.floor(local / span), 0, CHAPTERS.length - 1);
  const lp = (local - i * span) / span;
  const c = CHAPTERS[i];
  const heat = i / (CHAPTERS.length - 1);

  ctx.fillStyle = "#050002"; ctx.fillRect(0, 0, W, H);
  // each card pushes a little closer to her face than the last
  drawArt(IMG[ART_CYCLE[i % 3]], 0, 0, W, H,
    0.055 + heat * 0.10 + hit(lp, 0, .10) * 0.30, lerp(0.30, 0.02, heat));

  const cx = W / 2, AY = H * 0.5 - 190 * U;
  const enter = easeOut(clamp(lp / 0.16, 0, 1));

  ctx.save();
  ctx.globalAlpha = enter * exit;

  const ns = fitTracked("CHAPTER " + c.n, 34 * U, 0.34, W * 0.8, "bold");
  setFont(ns, "bold");

  glitchTracked(c.sub, cx, AY + 92 * U, 66 * U, 0.16, "#ffd6e9",
    hit(lp, 0, .18) * 1.1 + heat * 0.25, "900", "Arial Black, Impact, \"Segoe UI Symbol\", sans-serif");

  const rowY = AY + 212 * U;
  const rowW = Math.min(W * 0.78, 980 * U);
  const rs = 30 * U, rtr = rs * 0.20;

  tracked(c.key, cx - rowW / 2, rowY, rtr, "left");
  const kw = trackedWidth(c.key, rtr), vw = trackedWidth(c.val, rtr);
  const dotsW = rowW - kw - vw - 40 * U;
  const dotW = ctx.measureText(".").width;
  ctx.fillStyle = "rgba(157,23,77,0.5)";
  ctx.fillText(".".repeat(Math.max(0, Math.floor(dotsW / dotW))), cx - rowW / 2 + kw + 20 * U, rowY);
  if (lp > 0.42) {
    const sp = hit(lp, 0.42, 0.14);
    ctx.save();
    ctx.translate((jitter(t, i) - .5) * sp * 26 * U, 0);
    setFont(rs, "bold");
    ctx.shadowColor = "rgba(236,72,153,0.9)"; ctx.shadowBlur = 26 * U * (0.4 + sp);
    ctx.fillStyle = "#fff";
    tracked(c.val, cx + rowW / 2, rowY, rtr, "right");
    ctx.restore();
  }

  if (lp > 0.30) {
    setFont(24 * U, "normal");
    ctx.fillStyle = "rgba(249,168,212,0.82)";
    const shown = ('"' + c.quote + '"').slice(0, Math.floor((lp - 0.30) * span * 62));
    wrapLines(shown, Math.min(W * 0.80, 1000 * U)).forEach(function (l, k) {
      ctx.fillText(l, cx - ctx.measureText(l).width / 2, rowY + 92 * U + k * 34 * U);

  ctx.restore();

  const pct = lerp(0.12, 0.99, (i + lp) / CHAPTERS.length);
  const mw = Math.min(W * 0.78, 980 * U), mx = cx - mw / 2, my = H * 0.845;
  setFont(19 * U, "bold");

  tracked(Math.round(pct * 100) + "%", mx + mw, my - 18 * U, 19 * U * 0.28, "right");
  panel(mx, my, mw, 14 * U, "rgba(74,0,38,0.5)", "rgba(236,72,153,0.4)", Math.max(1, U));
  ctx.fillStyle = PINK;

  ctx.fillRect(mx + 2 * U, my + 2 * U, (mw - 4 * U) * pct, 10 * U);
  ctx.shadowBlur = 0;

  drawScanlines(t, 0.26 + heat * 0.08);
  drawNoise(t, 0.05 + heat * 0.07 + hit(lp, 0, .1) * .2);
  drawVignette();
  tearBands(t, hit(lp, 0, .18) * (0.9 + heat) + hit(lp, .42, .12) * (0.6 + heat));
  flash(hit(lp, 0, .12) * (0.10 + heat * 0.22), "rgba(255,150,200,1)");
}

/* ========= scene 5 : love bombing ========= */
const BOMB_WORDS = ["MINE", "I LOVE YOU", "FOREVER", "ONLY ME", "DON'T LOOK AWAY", "PERFECT", "MINE", "♥ ♥ ♥", "GOOD PET", "STAY"];
const BOMBS = (function () {
  const r = mulberry32(4242);
  const out = [];
  for (let i = 0; i < 26; i++) {
    out.push({
      at: i * 0.155,
      kind: r() < 0.62 ? "text" : (r() < 0.55 ? "warn" : "img"),
      word: BOMB_WORDS[Math.floor(r() * BOMB_WORDS.length)],
      x: 0.10 + r() * 0.62,
      y: 0.12 + r() * 0.66,
      s: 0.75 + r() * 0.75,
      rot: (r() - 0.5) * 0.12,
      art: ART_CYCLE[Math.floor(r() * 3)],
    });
  }
  return out;
})();
function sceneBomb(t) {
  const local = t - T.bomb[0];
  const heat = clamp(local / 3.4, 0, 1);
  ctx.fillStyle = "#0a0004"; ctx.fillRect(0, 0, W, H);
  drawArt(IMG.a, 0, 0, W, H, 0.10 + heat * 0.20, lerp(0.20, 0.0, heat));

  ctx.save();
  const sh = heat * 16 * U;
  ctx.translate((jitter(t, 1) - .5) * sh, (jitter(t, 2) - .5) * sh);

  for (const b of BOMBS) {
    if (local < b.at) continue;
    const age = local - b.at;
    const pop = easeOut(clamp(age / 0.13, 0, 1));
    const fade = 1 - clamp((age - 1.9) / 0.5, 0, 1);
    if (fade <= 0) continue;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(b.x * W, b.y * H);
    ctx.rotate(b.rot);
    ctx.scale(pop * b.s, pop * b.s);

    if (b.kind === "img") {
      const w = 300 * U, h = 200 * U;
      panel(-w / 2, -h / 2 - 26 * U, w, h + 26 * U, "#0d0006", PINK);
      ctx.fillStyle = PINK; ctx.fillRect(-w / 2, -h / 2 - 26 * U, w, 26 * U);
      setFont(15 * U, "bold"); ctx.fillStyle = "#1a0010";

      drawArt(IMG[b.art], -w / 2 + 4 * U, -h / 2 + 4 * U, w - 8 * U, h - 8 * U, 1, 0);
    } else if (b.kind === "warn") {

      setFont(17 * U, "bold"); ctx.fillStyle = "#ff8fb0";

      setFont(20 * U, "bold"); ctx.fillStyle = "#fff";

    } else {
      const s = fitTracked(b.word, 62 * U, 0.12, W * 0.55, "900", "Arial Black, Impact, \"Segoe UI Symbol\", sans-serif");
      setFont(s, "900", "Arial Black, Impact, \"Segoe UI Symbol\", sans-serif");

      ctx.fillStyle = "#ffe4f1";
      tracked(b.word, 0, 0, s * 0.12, "center");
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
  ctx.restore();

  drawScanlines(t, 0.30);
  drawNoise(t, 0.09 + heat * 0.12);
  drawVignette();
  tearBands(t, 0.9 + heat * 1.9);
  flash((0.05 + heat * 0.1) * jitter(t, 5), "rgba(255,120,180,1)");
  const cut = prog(local, 4.55, 4.85);
  if (cut > 0) { ctx.fillStyle = "rgba(0,0,0," + cut + ")"; ctx.fillRect(0, 0, W, H); }
}

/* ========= master draw ========= */
function draw(t) {
  t = clamp(t, 0, DUR);
  if (inRange(t, T.boot)) sceneBoot(t);
  else if (inRange(t, T.chat)) sceneChat(t);
  else if (inRange(t, T.title)) sceneTitle(t);
  else if (inRange(t, T.montage)) sceneMontage(t);
  else if (inRange(t, T.bomb)) sceneBomb(t);
  else if (inRange(t, T.voidsc)) sceneVoid(t);
  else sceneEnd(t);

/* ========= sound design =========
   Everything below is synthesised live except the ambient bed (bg-audio.mp3),
   which is filtered and automated so it sits under the hits instead of fighting them.
   Signal path:  sources -> master -> limiter -> speakers + recording tap
                 sources -> reverb send -> master                            */
const AudioEngine = {
  actx: null, el: null, bed: null, bedFilter: null, master: null, limiter: null,
  verb: null, verbGain: null, dest: null, noiseBuf: null, t0: 0, voices: [],

  init: function () {
    if (this.actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    const a = new AC();
    this.actx = a;

    this.limiter = a.createDynamicsCompressor();
    this.limiter.threshold.value = -8;
    this.limiter.knee.value = 6;
    this.limiter.ratio.value = 12;
    this.limiter.attack.value = 0.003;
    this.limiter.release.value = 0.25;

    this.master = a.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.limiter);
    this.limiter.connect(a.destination);
    this.dest = a.createMediaStreamDestination();
    this.limiter.connect(this.dest);

    // noise
    const len = a.sampleRate * 3;
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;

    // a dark, long reverb built from decaying filtered noise
    const rl = Math.floor(a.sampleRate * 2.8);
    const ir = a.createBuffer(2, rl, a.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const o = ir.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < rl; i++) {
        const n = Math.random() * 2 - 1;
        lp = lp * 0.72 + n * 0.28;                       // roll the top off
        o[i] = lp * Math.pow(1 - i / rl, 3.2);
      }
    }
    this.verb = a.createConvolver();
    this.verb.buffer = ir;
    this.verbGain = a.createGain();
    this.verbGain.gain.value = 0.55;
    this.verb.connect(this.verbGain);
    this.verbGain.connect(this.master);

    // ambient bed, filtered so it can open up on the drops
    this.el = new Audio(ASSET_AUDIO);
    this.el.loop = true;
    const src = a.createMediaElementSource(this.el);
    this.bedFilter = a.createBiquadFilter();
    this.bedFilter.type = "lowpass";
    this.bedFilter.frequency.value = 320;
    this.bedFilter.Q.value = 0.5;
    this.bed = a.createGain();
    this.bed.gain.value = 0.0001;
    src.connect(this.bedFilter); this.bedFilter.connect(this.bed); this.bed.connect(this.master);
  },

  // route a node to dry master + reverb send
  out: function (node, wet) {
    node.connect(this.master);
    if (wet > 0) {
      const s = this.actx.createGain();
      s.gain.value = wet;
      node.connect(s); s.connect(this.verb);
    }
  },
  track: function (n) { this.voices.push(n); },

  /* --- elements --- */
  // deep impact: pitch-dropping sine with a click transient
  sub: function (when, f0, f1, dur, gain, wet) {
    const a = this.actx, o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, when);
    o.frequency.exponentialRampToValueAtTime(Math.max(18, f1), when + dur * 0.85);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + 0.010);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); this.out(g, wet === undefined ? 0.12 : wet);
    o.start(when); o.stop(when + dur + 0.05);
    this.track(o);
    // transient click so it cuts through on phone speakers
    this.noise(when, 0.03, gain * 0.35, 2600, 0.8, "highpass", 0);
  },
  // the trailer horn — detuned saws through an opening filter
  braam: function (when, dur, gain, freq) {
    const a = this.actx, g = a.createGain(), f = a.createBiquadFilter();
    f.type = "lowpass"; f.Q.value = 3;
    f.frequency.setValueAtTime(180, when);
    f.frequency.exponentialRampToValueAtTime(1500, when + dur * 0.35);
    f.frequency.exponentialRampToValueAtTime(400, when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + 0.09);
    g.gain.setValueAtTime(gain, when + dur * 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    const detunes = [-8, 0, 7, -3];
    const mults = [1, 1, 2, 0.5];
    for (let i = 0; i < 4; i++) {
      const o = a.createOscillator();
      o.type = i === 3 ? "square" : "sawtooth";
      o.frequency.value = freq * mults[i];
      o.detune.value = detunes[i];
      o.connect(f);
      o.start(when); o.stop(when + dur + 0.08);
      this.track(o);
    }
    f.connect(g); this.out(g, 0.42);
  },
  noise: function (when, dur, gain, hz, q, type, wet) {
    const a = this.actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.85 + Math.random() * 0.3;
    f.type = type || "bandpass"; f.frequency.setValueAtTime(hz, when); f.Q.value = q || 1.2;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    s.connect(f); f.connect(g); this.out(g, wet === undefined ? 0.2 : wet);
    s.start(when, Math.random() * 1.5); s.stop(when + dur + 0.05);
    this.track(s);
  },
  // pressure building into a hit
  riser: function (when, dur, gain) {
    const a = this.actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = "bandpass"; f.Q.value = 7;
    f.frequency.setValueAtTime(200, when);
    f.frequency.exponentialRampToValueAtTime(7000, when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + dur * 0.94);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.05);
    s.connect(f); f.connect(g); this.out(g, 0.3);
    s.start(when); s.stop(when + dur + 0.1);
    this.track(s);
    // pitched partner, an octave rise
    const o = a.createOscillator(), og = a.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(70, when);
    o.frequency.exponentialRampToValueAtTime(280, when + dur);
    og.gain.setValueAtTime(0.0001, when);
    og.gain.exponentialRampToValueAtTime(gain * 0.5, when + dur * 0.94);
    og.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.05);
    o.connect(og); this.out(og, 0.2);
    o.start(when); o.stop(when + dur + 0.1);
    this.track(o);
  },
  // sucked-in swell that lands on `when + dur`
  reverseHit: function (when, dur, gain) {
    const a = this.actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = "bandpass"; f.Q.value = 2.5;
    f.frequency.setValueAtTime(300, when);
    f.frequency.exponentialRampToValueAtTime(3800, when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + dur);
    g.gain.linearRampToValueAtTime(0.0001, when + dur + 0.06);
    s.connect(f); f.connect(g); this.out(g, 0.35);
    s.start(when); s.stop(when + dur + 0.1);
    this.track(s);
  },
  tick: function (when, gain, hz) { this.noise(when, 0.022, gain, hz, 6, "bandpass", 0.05); },
  blip: function (when, freq, gain) {
    const a = this.actx, o = a.createOscillator(), g = a.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(freq, when);
    o.frequency.exponentialRampToValueAtTime(freq * 0.6, when + 0.18);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.22);
    o.connect(g); this.out(g, 0.5);
    o.start(when); o.stop(when + 0.3);
    this.track(o);
  },
  // digital chatter
  stutter: function (when, dur, gain, rate) {
    const n = Math.max(2, Math.round(dur * (rate || 46)));
    for (let i = 0; i < n; i++) {
      const at = when + (i / n) * dur;
      this.noise(at, 0.012, gain * (0.5 + Math.random()), 900 + Math.random() * 5200, 5, "bandpass", 0.05);
    }
  },
  heart: function (when, gain) {
    this.sub(when, 62, 30, 0.42, gain, 0.25);
    this.sub(when + 0.33, 54, 26, 0.34, gain * 0.62, 0.25);
  },
  // continuous low tension
  drone: function (when, dur, gain, freq) {
    const a = this.actx, g = a.createGain(), f = a.createBiquadFilter();
    f.type = "lowpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(220, when);
    f.frequency.linearRampToValueAtTime(900, when + dur);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(gain, when + Math.min(1.4, dur * 0.4));
    g.gain.setValueAtTime(gain, when + dur * 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    for (const dt of [-11, 4, 9]) {
      const o = a.createOscillator();
      o.type = "sawtooth"; o.frequency.value = freq; o.detune.value = dt;
      o.connect(f); o.start(when); o.stop(when + dur + 0.1);
      this.track(o);
    }
    f.connect(g); this.out(g, 0.3);
  },
  // pull the bed down under a hit so the impact reads
  duck: function (when, depth, level) {
    const g = this.bed.gain;
    g.setValueAtTime(Math.max(0.0001, level * (1 - depth)), when + 0.005);
    g.exponentialRampToValueAtTime(Math.max(0.0001, level), when + 0.34);
  },

  /* --- the score. t=0 is the first frame of the trailer --- */
  score: function () {
    const a = this.actx, t0 = a.currentTime + 0.15;
    this.t0 = t0;
    const bg = this.bed.gain, bf = this.bedFilter.frequency;
    const at = s => t0 + s;

    bg.cancelScheduledValues(a.currentTime);
    bf.cancelScheduledValues(a.currentTime);
    bg.setValueAtTime(0.0001, at(0));
    bf.setValueAtTime(300, at(0));

    // --- the link ---
    this.drone(at(0.2), 7.4, 0.085, 41.2);
    bg.exponentialRampToValueAtTime(0.14, at(3.2));
    for (let i = 0; i < 26; i++) this.tick(at(0.55 + i * 0.13), 0.045, 1900 + (i % 7) * 320);
    this.stutter(at(3.40), 0.14, 0.09);
    this.stutter(at(5.20), 0.10, 0.08);
    this.reverseHit(at(5.45), 0.88, 0.26);
    this.sub(at(6.34), 78, 28, 2.0, 0.85);
    this.noise(at(6.34), 0.45, 0.26, 1100, 0.8);
    this.stutter(at(6.34), 0.26, 0.14, 60);
    bg.setValueAtTime(0.0001, at(6.30));
    bg.exponentialRampToValueAtTime(0.30, at(6.85));
    bf.setValueAtTime(300, at(6.30));
    bf.exponentialRampToValueAtTime(5200, at(6.90));
    this.noise(at(7.30), 0.55, 0.16, 2400, 1.4);          // whoosh into the chat

    // --- she speaks ---
    this.drone(at(7.6), 9.2, 0.075, 46.2);
    const cfreq = [1180, 1080, 980, 900, 820];
    CHAT.forEach(function (c, i) { AudioEngine.blip(at(T.chat[0] + c.at), cfreq[i], 0.11); });
    this.braam(at(T.chat[0] + 4.2), 1.8, 0.10, 55);
    this.stutter(at(T.chat[0] + 6.3), 0.10, 0.09);
    this.riser(at(T.title[0] - 1.6), 1.58, 0.24);

    // --- title ---
    bg.setValueAtTime(0.30, at(T.title[0] - 0.02));
    this.braam(at(T.title[0]), 3.4, 0.34, 49);
    this.sub(at(T.title[0]), 92, 26, 3.2, 0.95);
    this.noise(at(T.title[0]), 0.75, 0.30, 820, 0.7);
    this.stutter(at(T.title[0]), 0.30, 0.15, 55);
    this.duck(at(T.title[0]), 0.9, 0.44);
    bg.setValueAtTime(0.44, at(T.title[0] + 0.5));
    bf.exponentialRampToValueAtTime(12000, at(T.title[0] + 0.6));
    this.sub(at(T.title[0] + 2.2), 70, 24, 1.2, 0.32);
    this.reverseHit(at(T.montage[0] - 0.62), 0.60, 0.24);

    // --- the stripping ---
    const span = (T.montage[1] - T.montage[0]) / CHAPTERS.length;
    this.drone(at(T.montage[0]), 16.2, 0.10, 55);
    for (let i = 0; i < CHAPTERS.length; i++) {
      const c = at(T.montage[0] + i * span);
      const k = i / (CHAPTERS.length - 1);
      this.sub(c, 108 + i * 7, 34, 0.85, 0.34 + k * 0.26);
      this.noise(c, 0.14, 0.13 + k * 0.12, 1700 + i * 240, 1.5);
      this.duck(c, 0.55, 0.44);
      // the permission flipping over to her
      const snap = c + span * 0.42;
      this.noise(snap, 0.09, 0.15 + k * 0.12, 4600, 5);
      this.blip(snap, 1320 + i * 110, 0.12 + k * 0.06);
      // pulse layer tightens as she takes more
      if (i >= 2) {
        const sub = 2 + Math.floor(k * 2);
        for (let j = 1; j < sub; j++) this.tick(c + (span / sub) * j, 0.05 + k * 0.05, 2600 + j * 500);
      }
      if (i >= 4) this.braam(c, span * 0.95, 0.10 + k * 0.10, 41.2 + i);
    }
    bf.exponentialRampToValueAtTime(15000, at(T.montage[1]));

    // --- love bombing ---
    this.drone(at(T.bomb[0]), 4.7, 0.18, 65);
    this.riser(at(T.bomb[0]), 4.35, 0.30);
    bg.setValueAtTime(0.44, at(T.bomb[0]));
    bg.exponentialRampToValueAtTime(0.62, at(T.bomb[1] - 0.55));
    for (let i = 0; i < 26; i++) {
      const at2 = at(T.bomb[0] + i * 0.155);
      this.noise(at2, 0.05, 0.11, 2400 + (i % 5) * 800, 4);
      if (i % 4 === 0) this.sub(at2, 150, 60, 0.3, 0.22);
    }
    this.sub(at(T.bomb[1] - 0.50), 210, 40, 0.55, 0.55);
    this.stutter(at(T.bomb[1] - 0.45), 0.32, 0.16, 70);
    bg.exponentialRampToValueAtTime(0.0001, at(T.bomb[1] - 0.06));   // the cut

    // --- the silence ---
    this.noise(at(T.voidsc[0]), 5.2, 0.022, 260, 0.6, "lowpass", 0.4);
    for (let i = 0; i < 5; i++) this.heart(at(T.voidsc[0] + 0.85 + i * 1.05), 0.26);
    this.reverseHit(at(T.endcard[0] - 0.66), 0.64, 0.30);

    // --- end card ---
    this.braam(at(T.endcard[0]), 4.2, 0.36, 49);
    this.sub(at(T.endcard[0]), 100, 26, 3.4, 0.95);
    this.noise(at(T.endcard[0]), 0.8, 0.30, 900, 0.7);
    this.stutter(at(T.endcard[0]), 0.28, 0.14, 55);
    this.drone(at(T.endcard[0]), 8.0, 0.10, 49);
    bg.setValueAtTime(0.0001, at(T.endcard[0] - 0.05));
    bg.exponentialRampToValueAtTime(0.40, at(T.endcard[0] + 0.6));
    bf.setValueAtTime(15000, at(T.endcard[0]));
    this.sub(at(T.endcard[0] + 2.6), 78, 24, 1.4, 0.28);
    this.blip(at(T.endcard[0] + 5.4), 900, 0.10);
    bg.setValueAtTime(0.40, at(DUR - 1.4));
    bg.exponentialRampToValueAtTime(0.0001, at(DUR - 0.08));

    this.el.currentTime = 0;
    const pr = this.el.play();
    if (pr && pr.catch) pr.catch(function () {});
  },

  stop: function () {
    this.t0 = 0;
    if (this.el) this.el.pause();
    if (!this.actx) return;
    const now = this.actx.currentTime;
    try {
      this.bed.gain.cancelScheduledValues(now);
      this.bed.gain.setValueAtTime(0.0001, now);
    } catch (e) {}
    for (const v of this.voices) { try { v.stop(now); } catch (e) {} }
    this.voices = [];
  }
};

/* ========= playback + recording ========= */
const elAspect = document.getElementById("aspect");
const elQuality = document.getElementById("quality");
const btnPreview = document.getElementById("preview");
const btnRecord = document.getElementById("record");
const btnStop = document.getElementById("stop");
const elStatus = document.getElementById("status");
const dlslot = document.getElementById("dlslot");

let raf = null, ticker = null, clockWorker = null, startMs = 0, running = false;
let recorder = null, recMime = "", chunks = [], recording = false, frameTrack = null;

function say(html) { elStatus.innerHTML = html; }
window.__done = false;
window.__saveAs = "";          // set before recording to POST the result to ./save

function pickMime() {
  const candidates = [
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for (const m of candidates) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return "";
}

// Hidden tabs throttle setInterval and rAF to about 1Hz, which would turn a
// recording into a slideshow. A worker's timer is not throttled, so the frame
// clock lives off-thread and the tab is free to go to the background.
function startClock(cb) {
  const period = Math.round(1000 / FPS);
  try {
    const src = "var id=setInterval(function(){postMessage(0)}," + period + ");" +
                "onmessage=function(){clearInterval(id);close()}";
    clockWorker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    clockWorker.onmessage = cb;
    return true;
  } catch (e) {
    clockWorker = null;
    ticker = setInterval(cb, period);
    return false;
  }
}
function stopClock() {
  if (clockWorker) { clockWorker.terminate(); clockWorker = null; }
  if (ticker) { clearInterval(ticker); ticker = null; }
}

function now() {
  return AudioEngine.t0 ? (AudioEngine.actx.currentTime - AudioEngine.t0)
                        : (performance.now() - startMs) / 1000;
}
function step() {
  const t = now();
  draw(t);
  if (frameTrack && frameTrack.requestFrame) frameTrack.requestFrame();
  if (recording) {
    say("Recording <b>" + Math.round(clamp(t / DUR, 0, 1) * 100) + "%</b> &nbsp;·&nbsp; " +
        clamp(t, 0, DUR).toFixed(1) + "s / " + DUR + "s" +
        (document.hidden ? " &nbsp;·&nbsp; tab hidden — fine, the frame clock is off-thread" : ""));
  } else {
    say("Playing &nbsp;·&nbsp; " + clamp(t, 0, DUR).toFixed(1) + "s / " + DUR + "s");
  }
  if (t >= DUR) { finish(); return; }
  if (!recording) raf = requestAnimationFrame(step);
}

function start(rec) {
  if (running) return;
  running = true; recording = !!rec;
  window.__done = false;
  dlslot.innerHTML = "";
  btnPreview.disabled = true; btnRecord.disabled = true;
  elAspect.disabled = true; elQuality.disabled = true;
  btnStop.disabled = false;

  AudioEngine.init();
  const go = function () {
    if (rec) {
      recMime = pickMime();
      // pull frames explicitly so recording never depends on the compositor
      let stream;
      const supportsManual = typeof canvas.captureStream === "function";
      stream = canvas.captureStream(supportsManual ? 0 : FPS);
      frameTrack = stream.getVideoTracks()[0];
      if (!frameTrack || !frameTrack.requestFrame) {
        stream = canvas.captureStream(FPS);
        frameTrack = null;
      }
      const audio = AudioEngine.dest.stream.getAudioTracks()[0];
      if (audio) stream.addTrack(audio);
      chunks = [];
      const opts = { videoBitsPerSecond: parseInt(elQuality.value, 10), audioBitsPerSecond: 192000 };
      if (recMime) opts.mimeType = recMime;
      try { recorder = new MediaRecorder(stream, opts); }
      catch (e) { recorder = new MediaRecorder(stream); recMime = recorder.mimeType; }
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = onRecordingStopped;
      recorder.start(1000);
    }
    startMs = performance.now();
    AudioEngine.score();
    if (rec) startClock(step);
    else raf = requestAnimationFrame(step);
  };

  if (AudioEngine.actx.state === "suspended") AudioEngine.actx.resume().then(go, go);
  else go();
}

function onRecordingStopped() {
  const type = (recMime || "video/webm").split(";")[0];
  const blob = new Blob(chunks, { type: type });
  const ext = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
  const mb = (blob.size / 1048576).toFixed(1);
  const name = "yandere-experience-trailer-" + elAspect.value.replace(":", "x") + "." + ext;

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.className = "dl";
  a.download = name;
  a.textContent = "↓ Save " + ext.toUpperCase() + " (" + mb + " MB)";
  dlslot.innerHTML = ""; dlslot.appendChild(a);
  say("Done — <b>" + ext.toUpperCase() + "</b>, " + mb + " MB. Click save." +
      (ext === "webm" ? " (No MP4 recording in this browser; WebM plays on YouTube/Discord, convert it for X.)" : ""));
  window.__done = true;
  window.__result = { name: name, size: blob.size, type: type };

  if (window.__saveAs) {
    fetch("save?name=" + encodeURIComponent(window.__saveAs), { method: "POST", body: blob })
      .then(function (r) { return r.text(); })
      .then(function (txt) { say("Done — saved to disk: <b>" + txt + "</b>"); })
      .catch(function (e) { say("Done, but the save failed: " + e.message); });
  }
}

function finish() {
  if (!running) return;
  running = false;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  stopClock();
  AudioEngine.stop();
  if (recorder && recorder.state !== "inactive") { recorder.stop(); say("Encoding…"); }
  else say("Stopped.");
  recorder = null; recording = false; frameTrack = null;
  btnPreview.disabled = false; btnRecord.disabled = false;
  elAspect.disabled = false; elQuality.disabled = false;
  btnStop.disabled = true;
}

btnPreview.onclick = function () { start(false); };
btnRecord.onclick = function () { start(true); };
btnStop.onclick = function () { finish(); };
elAspect.onchange = function () { setSize(elAspect.value); draw(T.endcard[0] + 3.0); };

/* ========= boot ========= */
setSize(elAspect.value);
buildNoise();
loadArt().then(function () {
  draw(T.endcard[0] + 3.0);
  const m = pickMime();
  say("Ready — output format: <b>" + (m ? m.split(";")[0] : "browser default") + "</b>");
});
</script>
</body>
</html>
