<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__ — Trailer Renderer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #07000a; color: #f472b6;
    font-family: "Courier New", ui-monospace, monospace;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px;
  }
  h1 { font-size: 13px; letter-spacing: .35em; text-transform: uppercase; color: #9d174d; margin: 0; }
  #stage { position: relative; display: flex; justify-content: center; }
  canvas {
    background: #000; border: 1px solid rgba(236,72,153,.35);
    box-shadow: 0 0 60px rgba(236,72,153,.18);
    max-height: 68vh; max-width: 96vw; height: auto; width: auto;
  }
  .panel {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    border: 1px solid rgba(236,72,153,.3); background: #0d0006; padding: 12px 16px; max-width: 920px;
  }
  button, select {
    font-family: inherit; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    background: #16000c; color: #f9a8d4; border: 1px solid rgba(236,72,153,.45);
    padding: 9px 14px; cursor: pointer; transition: .2s;
  }
  button:hover:not(:disabled), select:hover { background: #2a0016; color: #fff; border-color: #ec4899; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: #4a0026; color: #fff; border-color: #ec4899; }
  #status { font-size: 11px; letter-spacing: .16em; color: #9d174d; min-height: 16px; text-align: center; }
  #status b { color: #f9a8d4; font-weight: normal; }
  a.dl { color: #fff; background: #831843; border: 1px solid #ec4899; padding: 9px 14px;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; text-decoration: none; }
  .hint { font-size: 10px; letter-spacing: .1em; color: #6b1233; max-width: 780px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<h1>[ __H1__ // Trailer Renderer ]</h1>

<div id="stage"><canvas id="c"></canvas></div>

<div class="panel">
  <select id="aspect">
    <option value="16:9">16:9 — 1920x1080 (landscape)</option>
    <option value="9:16">9:16 — 1080x1920 (reels / shorts / stories)</option>
    <option value="1:1">1:1 — 1080x1080 (square)</option>
  </select>
  <select id="quality">
    <option value="12000000">Quality: High (12 Mbps)</option>
    <option value="20000000">Quality: Max (20 Mbps)</option>
    <option value="6000000">Quality: Light (6 Mbps)</option>
  </select>
  <button id="preview" class="primary">&#9654; Preview</button>
  <button id="record">&#9210; Record video</button>
  <button id="stop" disabled>&#9632; Stop</button>
  <span id="dlslot"></span>
</div>

<div id="status">Ready.</div>
<div class="hint">
  Preview plays it with sound. Record renders the same thing in real time and hands you a file at the end &mdash;
  it takes __DUR__ seconds and you can use other tabs meanwhile. Everything is baked into this one file; it works offline.
</div>


<script>
"use strict";

/* ========= per-trailer module ========= */
__TRAILER__

/* ========= shared engine ========= */
__ENGINE__
</script>
</body>
</html>
